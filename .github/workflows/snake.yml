name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure Profile Directory Exists
        run: mkdir -p profile

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: tamjid-ahsan
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit and Push Snake Assets
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile/snake.svg profile/snake-dark.svg
          git commit -m "chore: update contribution snake animation in profile/ [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
