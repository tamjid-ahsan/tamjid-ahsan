name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Trophies SVG via Python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request
          from datetime import datetime

          username = "tamjid-ahsan"
          token = os.environ.get("GH_TOKEN", "")
          headers = {"User-Agent": "Python-Trophy-Generator"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          # 1. Fetch user profile
          req_user = urllib.request.Request(f"https://api.github.com/users/{username}", headers=headers)
          with urllib.request.urlopen(req_user) as resp:
              user_data = json.loads(resp.read().decode())

          # 2. Fetch user repositories (for stars)
          req_repos = urllib.request.Request(f"https://api.github.com/users/{username}/repos?per_page=100", headers=headers)
          with urllib.request.urlopen(req_repos) as resp:
              repos_data = json.loads(resp.read().decode())

          repos_count = user_data.get("public_repos", 0)
          followers_count = user_data.get("followers", 0)
          total_stars = sum(r.get("stargazers_count", 0) for r in repos_data if isinstance(r, dict))
          
          # Calculate account age in years
          created_at = user_data.get("created_at", "2022-01-01T00:00:00Z")
          created_year = int(created_at[:4])
          curr_year = datetime.now().year
          exp_years = max(1, curr_year - created_year)

          def get_rank(val, thresholds):
              ranks = ["C", "B", "A", "S", "SS", "SSS"]
              for i, t in enumerate(thresholds):
                  if val < t:
                      return ranks[i]
              return ranks[-1]

          trophies = [
              {"title": "Repositories", "value": f"{repos_count} Repos", "rank": get_rank(repos_count, [3, 8, 15, 30, 60]), "color": "#7aa2f7"},
              {"title": "Stars Earned", "value": f"{total_stars} Stars", "rank": get_rank(total_stars, [2, 10, 25, 50, 100]), "color": "#e0af68"},
              {"title": "Followers", "value": f"{followers_count} Users", "rank": get_rank(followers_count, [2, 5, 15, 30, 50]), "color": "#bb9af7"},
              {"title": "Experience", "value": f"{exp_years}+ Years", "rank": get_rank(exp_years, [1, 2, 3, 5, 8]), "color": "#73daca"}
          ]

          # Build SVG
          card_w, card_h, gap = 135, 125, 15
          total_w = len(trophies) * card_w + (len(trophies) - 1) * gap + 20
          total_h = card_h + 20

          cards_svg = ""
          for i, t in enumerate(trophies):
              x = 10 + i * (card_w + gap)
              y = 10
              cards_svg += f"""
              <g transform="translate({x}, {y})">
                <!-- Card Background -->
                <rect width="{card_w}" height="{card_h}" rx="12" fill="#16161e" stroke="#292e42" stroke-width="1.5" />
                
                <!-- Trophy Icon Graphic -->
                <g transform="translate({card_w//2 - 16}, 16)">
                  <path d="M7 4h18v4a9 9 0 0 1-9 9 9 9 0 0 1-9-9V4zm-3 2H1a1 1 0 0 0-1 1 6 6 0 0 0 6 6h1V9a7 7 0 0 1-3-3zm24 0h-3a7 7 0 0 1-3 3v4h1a6 6 0 0 0 6-6 1 1 0 0 0-1-1zM14 20h4v4h-4v-4zm-4 4h12v2H10v-2z" fill="{t['color']}"/>
                </g>
                
                <!-- Rank Pill -->
                <circle cx="{card_w - 20}" cy="20" r="11" fill="{t['color']}" opacity="0.15"/>
                <text x="{card_w - 20}" y="24" fill="{t['color']}" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" text-anchor="middle">{t['rank']}</text>

                <!-- Titles and Values -->
                <text x="{card_w//2}" y="78" fill="#c0caf5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">{t['title']}</text>
                <text x="{card_w//2}" y="98" fill="#787c99" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" text-anchor="middle">{t['value']}</text>
              </g>
              """

          svg_content = f"""<svg xmlns="http://www.w3.org/2000/svg" width="{total_w}" height="{total_h}" viewBox="0 0 {total_w} {total_h}">
          <style>
            @media (prefers-color-scheme: light) {{
              rect {{ fill: #f7f8fa; stroke: #e1e4e8; }}
              text {{ fill: #24292e; }}
            }}
          </style>
          {cards_svg}
          </svg>"""

          with open("path/trophies.svg", "w", encoding="utf-8") as f:
              f.write(svg_content)
          print("trophies.svg generated successfully!")
          EOF

      - name: Commit and Push
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add path/trophies.svg
          git commit -m "chore: update trophies.svg" -a || exit 0
          git pull --rebase origin main
          git push origin main