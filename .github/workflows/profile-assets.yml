name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-assets:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure Profile Directory Exists
        run: mkdir -p profile

      # -----------------------------------------------------------
      # 1. Platane Snake Animation
      # -----------------------------------------------------------
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_STATS_TOKEN }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      # -----------------------------------------------------------
      # 2. GitHub Readme Stats Cards
      # -----------------------------------------------------------
      - name: Generate Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=nightowl
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=nightowl
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true
      
      - name: Generate Streak Stats Card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=tamjid-ahsan&theme=tokyonight&hide_border=true
          path: profile/streak-stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      # - name: Generate Pin Card
      #   uses: stats-organization/github-readme-stats-action@v2
      #   with:
      #     card: pin
      #     options: username=stats-organization&repo=github-readme-stats&theme=nightowl
      #     path: profile/pin-stats-organization-github-readme-stats.svg
      #     token: ${{ secrets.PROFILE_STATS_TOKEN }}

      
      # -----------------------------------------------------------
      # 3. Python-Generated Custom Trophies
      # -----------------------------------------------------------
      - name: Generate Custom Trophies
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python3 - << 'EOF'
          import os
          import json
          import urllib.request
          from datetime import datetime

          username = os.environ["GH_USER"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "User-Agent": "Python-Trophy-Generator",
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def github_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode())

          # Verify that the PAT belongs to the intended account.
          authenticated_user = github_get(
              "https://api.github.com/user"
          )

          if authenticated_user.get("login", "").lower() != username.lower():
              raise RuntimeError(
                  "PROFILE_STATS_TOKEN belongs to a different GitHub account."
              )

          # Retrieve public and private repositories owned by the account.
          repos_data = []
          page = 1

          while True:
              url = (
                  "https://api.github.com/user/repos"
                  f"?visibility=all&affiliation=owner"
                  f"&per_page=100&page={page}"
              )

              batch = github_get(url)

              if not batch:
                  break

              repos_data.extend(batch)

              if len(batch) < 100:
                  break

              page += 1

          # Account information.
          user_data = github_get(
              f"https://api.github.com/users/{username}"
          )

          repos_count = len(repos_data)
          private_repos = sum(
              1 for r in repos_data if r.get("private", False)
          )
          public_repos = repos_count - private_repos

          followers_count = user_data.get("followers", 0)

          total_stars = sum(
              r.get("stargazers_count", 0)
              for r in repos_data
          )

          created_at = user_data["created_at"]
          created_year = int(created_at[:4])

          curr_year = datetime.now().year
          account_years = max(1, curr_year - created_year)

          def get_rank(val, thresholds):
              ranks = ["C", "B", "A", "S", "SS", "SSS"]
              for i, threshold in enumerate(thresholds):
                  if val < threshold:
                      return ranks[i]
              return ranks[-1]

          trophies = [
              {
                  "title": "Repositories",
                  "value": f"{repos_count} Repos",
                  "rank": get_rank(repos_count, [3, 8, 15, 30, 60]),
                  "color": "#7aa2f7"
              },
              {
                  "title": "Stars Earned",
                  "value": f"{total_stars} Stars",
                  "rank": get_rank(total_stars, [2, 10, 25, 50, 100]),
                  "color": "#e0af68"
              },
              {
                  "title": "Followers",
                  "value": f"{followers_count} Users",
                  "rank": get_rank(followers_count, [2, 5, 15, 30, 50]),
                  "color": "#bb9af7"
              },
              {
                  "title": "GitHub Account",
                  "value": f"{account_years}+ Years",
                  "rank": get_rank(account_years, [1, 2, 3, 5, 8]),
                  "color": "#73daca"
              }
          ]

          card_w, card_h, gap = 135, 125, 15
          total_w = len(trophies) * card_w + (len(trophies) - 1) * gap + 20
          total_h = card_h + 20

          cards_svg = ""

          for i, t in enumerate(trophies):
              x = 10 + i * (card_w + gap)
              y = 10

              cards_svg += f"""
              <g transform="translate({x}, {y})">
                <rect width="{card_w}" height="{card_h}" rx="12"
                      fill="#16161e" stroke="#292e42" stroke-width="1.5"/>

                <g transform="translate({card_w//2 - 16}, 16)">
                  <path d="M7 4h18v4a9 9 0 0 1-9 9 9 9 0 0 1-9-9V4zm-3 2H1a1 1 0 0 0-1 1 6 6 0 0 0 6 6h1V9a7 7 0 0 1-3-3zm24 0h-3a7 7 0 0 1-3 3v4h1a6 6 0 0 0 6-6 1 1 0 0 0-1-1zM14 20h4v4h-4v-4zm-4 4h12v2H10v-2z"
                        fill="{t['color']}"/>
                </g>

                <circle cx="{card_w - 20}" cy="20" r="11"
                        fill="{t['color']}" opacity="0.15"/>

                <text x="{card_w - 20}" y="24"
                      fill="{t['color']}" font-size="10"
                      font-weight="bold" text-anchor="middle">
                  {t['rank']}
                </text>

                <text x="{card_w//2}" y="78"
                      fill="#c0caf5" font-size="12"
                      font-weight="600" text-anchor="middle">
                  {t['title']}
                </text>

                <text x="{card_w//2}" y="98"
                      fill="#787c99" font-size="11"
                      font-weight="500" text-anchor="middle">
                  {t['value']}
                </text>
              </g>
              """

          svg_content = f"""<svg xmlns="http://www.w3.org/2000/svg"
          width="{total_w}" height="{total_h}"
          viewBox="0 0 {total_w} {total_h}">
          <style>
            text {{
              font-family: -apple-system, BlinkMacSystemFont,
              'Segoe UI', Helvetica, Arial, sans-serif;
            }}
            @media (prefers-color-scheme: light) {{
              rect {{ fill: #f7f8fa; stroke: #e1e4e8; }}
              text {{ fill: #24292e; }}
            }}
          </style>
          {cards_svg}
          </svg>"""

          os.makedirs("profile", exist_ok=True)

          with open("profile/trophies.svg", "w", encoding="utf-8") as f:
              f.write(svg_content)

          print("Trophies generated successfully!")
          print(f"Total repositories: {repos_count}")
          print(f"Public repositories: {public_repos}")
          print(f"Private repositories: {private_repos}")
          print(f"Total stars: {total_stars}")
          print(f"Followers: {followers_count}")
          print(f"GitHub account age: {account_years} years")
          EOF

      # -----------------------------------------------------------
      # 4. Commit and Push All Assets in One Step
      # -----------------------------------------------------------
      - name: Commit and Push All Assets
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile/*.svg
          git commit -m "chore: update profile assets [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
